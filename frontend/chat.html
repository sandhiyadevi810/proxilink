<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messaging – ProxiLink Wireless Platform</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <style>
    .chat-container {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 65px);
      overflow: hidden;
    }
    .chat-sidebar {
      background: var(--bg-surface-solid);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .chat-main {
      display: flex;
      flex-direction: column;
      background: var(--bg-main);
      overflow: hidden;
      height: 100%;
    }
    .chat-header {
      padding: 0.9rem 1.5rem;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-messages-area {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .chat-input-bar {
      padding: 0.9rem 1.5rem;
      background: var(--bg-surface-solid);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .emoji-bar {
      display: flex;
      gap: 0.4rem;
      font-size: 1.15rem;
    }
    .emoji-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0.2rem 0.4rem;
      border-radius: var(--radius-xs);
      transition: var(--transition);
    }
    .emoji-btn:hover {
      background: rgba(99, 102, 241, 0.15);
      transform: scale(1.2);
    }
    .mobile-back-btn {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar">
    <div class="brand-container">
      <a href="dashboard.html" class="flex items-center gap-2">
        <div class="brand-logo">
          <i class="fa-solid fa-link" style="color:#FFF"></i>
        </div>
        <span class="brand-text">Proxi<span>Link</span></span>
      </a>
    </div>

    <div class="nav-actions">
      <button class="btn btn-ghost btn-sm theme-toggle-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
        <i class="fa-solid fa-sun"></i>
      </button>
      <a href="dashboard.html" class="btn btn-ghost btn-sm">
        <i class="fa-solid fa-arrow-left"></i> Dashboard
      </a>
    </div>
  </nav>

  <!-- Chat 2-Column Container -->
  <div class="chat-container">
    <!-- Left Sidebar: Contacts & Groups -->
    <aside class="chat-sidebar">
      <div style="padding:1.25rem 1rem 0.75rem;border-bottom:1px solid var(--border-subtle)">
        <div class="flex items-center justify-between" style="margin-bottom:0.75rem">
          <h3 style="font-size:1.1rem">Discussions</h3>
          <span class="badge badge-primary">Offline LAN</span>
        </div>
        <div class="input-with-icon">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" class="form-control" placeholder="Search contacts..." style="padding-top:0.5rem;padding-bottom:0.5rem;font-size:0.85rem" />
        </div>
      </div>

      <!-- Contacts List -->
      <div id="chat-contacts-list" class="flex flex-col gap-1" style="padding:0.75rem">
        <!-- Populated by chat.js -->
      </div>
    </aside>

    <!-- Right: Chat Pane -->
    <main class="chat-main">
      <!-- Chat Header -->
      <div class="chat-header">
        <div class="flex items-center gap-3">
          <button class="btn btn-ghost btn-icon mobile-back-btn" onclick="toggleMobileChatSidebar()">
            <i class="fa-solid fa-arrow-left"></i>
          </button>
          <div id="chat-peer-avatar" style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--secondary),var(--primary));color:#FFF;display:flex;align-items:center;justify-content:center;font-weight:700">
            AJ
          </div>
          <div>
            <h4 id="chat-peer-name" style="margin:0;font-size:1.05rem">Alex Johnson</h4>
            <div id="chat-peer-status" class="text-xs text-muted">Online (Direct LAN)</div>
          </div>
        </div>

        <div class="flex items-center gap-3" style="flex-wrap:wrap">
          <!-- Mode Selector -->
          <div class="flex items-center gap-1" style="background:var(--bg-input);padding:0.2rem;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)">
            <button id="mode-btn-wifi" class="btn btn-primary btn-sm" onclick="setCommunicationMode('wifi')" title="Transfer via Wi-Fi WebRTC DataChannel">
              <i class="fa-solid fa-wifi"></i> Wi-Fi P2P
            </button>
            <button id="mode-btn-bt" class="btn btn-ghost btn-sm" onclick="setCommunicationMode('bluetooth')" title="Transfer via Bluetooth BLE GATT">
              <i class="fa-brands fa-bluetooth-b"></i> Bluetooth BLE
            </button>
          </div>

          <!-- Active Protocol Indicator -->
          <span id="active-proto-badge" class="proto-badge proto-webrtc"><i class="fa-solid fa-shield-check"></i> WebRTC P2P</span>
          
          <!-- In-Chat Search Toggle -->
          <div class="input-with-icon" style="max-width:180px">
            <i class="fa-solid fa-magnifying-glass" style="font-size:0.75rem"></i>
            <input type="text" id="chat-search-input" class="form-control" placeholder="Search chat..." oninput="handleChatSearch(event)" style="padding:0.3rem 0.5rem 0.3rem 1.8rem;font-size:0.8rem;height:auto" />
          </div>
        </div>
      </div>

      <!-- Offline Outbox Queue Banner (Shown when peer is unreachable) -->
      <div id="chat-offline-queue-banner" class="hidden" style="padding:0.5rem 1.25rem;background:rgba(245,158,11,0.12);border-bottom:1px solid rgba(245,158,11,0.25);font-size:0.8rem;color:var(--warning);display:flex;align-items:center;justify-content:space-between">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-clock-rotate-left"></i>
          <span id="offline-queue-text">0 messages pending in offline outbox.</span>
        </div>
        <button class="btn btn-warning btn-sm" style="padding:0.15rem 0.6rem;font-size:0.75rem" onclick="retryFlushOfflineQueue()">
          <i class="fa-solid fa-rotate-right"></i> Retry Sync
        </button>
      </div>

      <!-- Messages Pane -->
      <div class="chat-messages-area" id="chat-messages-pane">
        <!-- Populated by chat.js -->
      </div>

      <!-- Typing Indicator -->
      <div id="chat-typing-indicator" class="hidden" style="padding:0.4rem 1.5rem;font-size:0.8rem;color:var(--text-muted);display:flex;align-items:center;gap:0.4rem">
        <i class="fa-solid fa-circle-notch fa-spin text-primary"></i>
        <span>Peer is typing...</span>
      </div>

      <!-- Input Bar -->
      <div class="chat-input-bar">
        <!-- Quick Emoji Toolbar -->
        <div class="emoji-bar flex justify-between items-center">
          <div class="flex gap-1">
            <button class="emoji-btn" onclick="insertEmoji('👍')">👍</button>
            <button class="emoji-btn" onclick="insertEmoji('👋')">👋</button>
            <button class="emoji-btn" onclick="insertEmoji('🚀')">🚀</button>
            <button class="emoji-btn" onclick="insertEmoji('🔒')">🔒</button>
            <button class="emoji-btn" onclick="insertEmoji('📁')">📁</button>
            <button class="emoji-btn" onclick="insertEmoji('⚡')">⚡</button>
          </div>
          <span id="current-mode-indicator" class="text-xs text-muted">
            <i class="fa-solid fa-circle-dot text-success"></i> Wi-Fi Channel
          </span>
        </div>

        <div class="flex gap-2 items-center">
          <!-- Attachment Picker -->
          <input type="file" id="chat-file-input" style="display:none" onchange="handleChatFileAttach(event)" />
          <button class="btn btn-secondary btn-icon" onclick="document.getElementById('chat-file-input').click()" title="Attach image or document">
            <i class="fa-solid fa-paperclip"></i>
          </button>

          <input type="text" id="chat-input-text" class="form-control" placeholder="Type an offline message... (Press Enter to send)" onkeydown="handleChatKeyDown(event)" autocomplete="off" />
          <button class="btn btn-primary" onclick="sendChatMessage()">
            <i class="fa-solid fa-paper-plane"></i> Send
          </button>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/main.js"></script>
  <script src="js/webrtc-p2p.js"></script>
  <script src="js/bluetooth-ble.js"></script>
  <script src="js/unified-comms.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
