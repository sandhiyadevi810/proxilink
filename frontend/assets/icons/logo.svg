<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="proxiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Wireless Pulse Waves -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#proxiGrad)" stroke-width="3" stroke-dasharray="10 8" opacity="0.4"/>
  <circle cx="100" cy="100" r="66" fill="none" stroke="url(#proxiGrad)" stroke-width="4" opacity="0.6"/>
  <!-- Central Glowing Hexagon Node -->
  <rect x="52" y="52" width="96" height="96" rx="28" fill="url(#proxiGrad)" filter="url(#glow)"/>
  <!-- Interlinked Nodes -->
  <path d="M78 100 L122 100 M100 78 L100 122" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <circle cx="78" cy="100" r="9" fill="#FFFFFF"/>
  <circle cx="122" cy="100" r="9" fill="#FFFFFF"/>
  <circle cx="100" cy="78" r="9" fill="#FFFFFF"/>
  <circle cx="100" cy="122" r="9" fill="#FFFFFF"/>
  <circle cx="100" cy="100" r="6" fill="#3B82F6"/>
</svg>
